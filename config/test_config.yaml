# 测试配置文件
test:
  base_url: "http://10.11.150.73:10088"
  environment: "dev"
  retry_count: 2
  implicit_wait: 10

browser:
  headless: false
  slow_mo: 100
  timeout: 30000
  viewport:
    width: 1920
    height: 1080

# 环境配置
environments:
  dev:
    base_url: "http://redclaw.linkupai.cn:10089"
    database_url: "dev_db_connection_string"
  test:
    base_url: "https://test.redclaw.example.com"
    database_url: "test_db_connection_string"
  prod:
    base_url: "https://redclaw.example.com"
    database_url: "prod_db_connection_string"

# 测试数据配置
