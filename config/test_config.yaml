      username: "user"
      password: "user123"

# 页面配置
pages:
  login:
    url: "/login"
    load_indicator: 'text="请输入用户名"'
  register:
    url: "/register"
    load_indicator: 'text="注册"'
  plaza:
    url: "/plaza"
    load_indicator: 'text="智能体广场"'
  dashboard:
    url: "/dashboard"
    load_indicator: 'text="数字员工"'
  create_agent:
    url: "/agents/new"
    load_indicator: 'text="新建数字员工"'
