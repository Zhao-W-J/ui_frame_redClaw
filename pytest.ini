[tool:pytest]
testpaths = tests
addopts = 
    --html=reports/report.html 
    --self-contained-html
    --alluredir=reports/allure-results
    --capture=no
    -v
    --tb=short
    --strict-markers
markers =
    smoke: 冒烟测试
    regression: 回归测试
    critical: 关键功能测试
    ui: UI界面测试
    api: API接口测试
    slow: 慢速测试
python_files = test_*.py
python_classes = Test*
python_functions = test_* 